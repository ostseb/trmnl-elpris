# trmnlp configuration (local only: `trmnlp push` uploads src/, not this file).
# {{ env.VARIABLE }} interpolation is available here.
---
watch:
  - .trmnlp.yml
  - src

time_zone: Europe/Stockholm

# Values for the form fields in src/settings.yml, used by `trmnlp serve` previews.
custom_fields:
  area: "SE3"
  vat: "true"
  addon_ore: "0"
  cheap_hours: "3"

variables:
  trmnl:
    user:
      locale: sv
